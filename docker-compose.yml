services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in .env}
      WORKER_URL: http://worker:8000
      WORKER_TOKEN: ${WORKER_TOKEN:?Set a unique WORKER_TOKEN in .env}
      ADMIN_ID: ${ADMIN_ID:?Set ADMIN_ID in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a unique ADMIN_PASSWORD in .env}
      COOKIE_NAME: ${COOKIE_NAME:-yt_dashboard_session}
      COOKIE_SECURE: ${COOKIE_SECURE:?Set COOKIE_SECURE in .env (false for local HTTP, true for HTTPS)}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      YOUTUBE_API_KEY_CONFIGURED: ${YOUTUBE_API_KEY:+true}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_started
    ports:
      - "4000:4000"
    command: npm run dev
    volumes:
      - ./apps/api:/app
      - /app/node_modules

  worker:
    build:
      context: ./services/collector
    restart: unless-stopped
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN:?Set a unique WORKER_TOKEN in .env}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      MAX_VIDEOS_PER_CHANNEL: ${MAX_VIDEOS_PER_CHANNEL:-100}
      COLLECTION_CHANNEL_CONCURRENCY: ${COLLECTION_CHANNEL_CONCURRENCY:-6}
      API_INTERNAL_URL: http://api:4000/api/v1
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      YOUTUBE_COOKIES_FILE: ${YOUTUBE_COOKIES_PATH:+/run/secrets/youtube-cookies.txt}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    volumes:
      - ./services/collector:/app
      - ${YOUTUBE_COOKIES_PATH:-/dev/null}:/run/secrets/youtube-cookies.txt:ro

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      API_INTERNAL_URL: http://api:4000
    depends_on:
      - api
    ports:
      - "3000:3000"
    command: npm run dev
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
